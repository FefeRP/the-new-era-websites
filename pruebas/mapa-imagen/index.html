<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba mapa por niveles de imagen</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #0e1418; color: #f4efe6; }
    .intro, .final { min-height: 100svh; display: grid; place-items: center; padding: 8vw; text-align: center; }
    .intro h1 { font: 400 clamp(2rem, 5vw, 4rem)/1.1 Georgia, serif; }
    #mapa { position: relative; height: 500svh; }                         /* recorrido largo */
    .escenario { position: sticky; top: 0; height: 100svh; overflow: clip; }
    /* velo arriba para que el texto se lea sobre cualquier foto */
    .escenario::after { content: ''; position: absolute; inset: 0 0 auto 0; height: 40%; z-index: 4; pointer-events: none;
      background: linear-gradient(rgba(14,20,24,.7), rgba(14,20,24,0)); }
    .fase { position: absolute; left: 6vw; top: 8svh; z-index: 5; max-width: 30ch; font: 400 clamp(1.3rem, 2.6vw, 2.2rem)/1.2 Georgia, serif;
      text-shadow: 0 1px 12px rgba(0,0,0,.6); opacity: 0; transition: opacity .4s; }
    .fase.activa { opacity: 1; }
    .pin { display: grid; justify-items: center; gap: 6px; pointer-events: none; }
    .pin span { background: #f4efe6; color: #1d2a33; font-size: 14px; padding: 4px 10px; border-radius: 4px; white-space: nowrap; }
    .pin i { width: 14px; height: 14px; border-radius: 50%; background: #ff6a3d; box-shadow: 0 0 0 4px rgba(255,106,61,.35); }
    .distancia { background: #1d2a33; color: #f4efe6; font-size: 13px; padding: 3px 8px; border-radius: 4px; pointer-events: none; }
    .atribucion { position: absolute; right: 8px; bottom: 6px; z-index: 6; font-size: 11px; background: rgba(14,20,24,.7); padding: 2px 6px; border-radius: 3px; }
    @media (prefers-reduced-motion: reduce) { .fase { transition: none; } }
  </style>
</head>
<body>
  <section class="intro"><h1>De la ciudad a la calle</h1></section>
  <section id="mapa" aria-label="Recorrido por el mapa: de Barcelona a la Torre Glòries, pasando por la Sagrada Família">
    <div class="escenario">
      <p class="fase" data-desde="0" data-hasta="0.2">Barcelona</p>
      <p class="fase" data-desde="0.2" data-hasta="0.42">El Eixample, entre dos iconos</p>
      <p class="fase" data-desde="0.42" data-hasta="0.6">Empezamos en la Sagrada Família</p>
      <p class="fase" data-desde="0.6" data-hasta="1.01">A 1,3 km, la Torre Glòries</p>
      <div class="pin" id="pin-templo"><span>Sagrada Família</span><i></i></div>
      <div class="pin" id="pin-torre"><span>Torre Glòries</span><i></i></div>
      <div class="distancia" id="distancia">1,3 km</div>
      <p class="atribucion" id="atribucion"></p>
    </div>
  </section>
  <section class="final"><p>Fin del recorrido</p></section>
  <script type="module">
    import { crearMapaImagen } from '../../plugins/the-new-era-websites/skills/mapa-zoom-ubicacion/scripts/mapa-imagen.js';
    const $ = (s) => document.querySelector(s);
    const datos = await (await fetch('activos/niveles.json')).json();
    $('#atribucion').textContent = datos.atribucion;
    // ?sin=2,3 quita niveles (para comparar la nitidez sin ellos); solo los últimos, para no mover los índices de `padre`
    const sin = new URLSearchParams(location.search).get('sin')?.split(',').map(Number) ?? [];
    const niveles = datos.niveles.filter((_, i) => !sin.includes(i)).map((n) => ({ ...n, src: 'activos/' + n.src }));
    const { torre, templo } = datos.puntos;
    // caja centrada en un punto con la proporción de la base (en fracciones, ancho = alto)
    const alrededor = (p, ancho) => ({ x: p.x - ancho / 2, y: p.y - ancho / 2, ancho, alto: ancho });
    const m = crearMapaImagen({
      contenedor: $('.escenario'),
      niveles,
      // función del tamaño: en vertical, el encuadre final algo más cerrado (la vista es más alta que el nivel de calle)
      paradas: ({ ancho, alto }) => [
        { en: 0, caja: { x: 0, y: 0, ancho: 1, alto: 1 }, cubrir: true },
        { en: 0.25, caja: datos.niveles[1].caja },
        { en: 0.5, caja: alrededor(templo, 0.03) },
        { en: 0.82, caja: alrededor(torre, 0.03), arco: 1 },     // de una zona a otra: a mitad de tramo se ven las dos
        { en: 1, caja: alrededor(torre, alto > ancho ? 0.02 : 0.022) },
      ],
      marcadores: [
        { el: $('#pin-templo'), x: templo.x, y: templo.y, desde: 0.3, hasta: 0.7, ancla: 'abajo' },
        { el: $('#pin-torre'), x: torre.x, y: torre.y, desde: 0.62, hasta: 1, ancla: 'abajo' },
        { el: $('#distancia'), x: (torre.x + templo.x) / 2, y: (torre.y + templo.y) / 2 - 0.004, desde: 0.6, hasta: 0.78 },
      ],
      rutas: [{ puntos: [[templo.x, templo.y], [torre.x, torre.y]], desde: 0.52, hasta: 0.72, color: '#ff6a3d', ancho: 4, discontinua: true }],
    });
    await m.listo;
    // progreso con el scroll (sin GSAP; con GSAP sería ScrollTrigger con scrub → m.progreso(st.progress))
    const seccion = $('#mapa'), fases = [...document.querySelectorAll('.fase')];
    const alScroll = () => {
      const r = seccion.getBoundingClientRect();
      const p = Math.min(1, Math.max(0, -r.top / (r.height - innerHeight)));
      m.progreso(p);
      for (const f of fases) f.classList.toggle('activa', p >= +f.dataset.desde && p < +f.dataset.hasta);
    };
    addEventListener('scroll', alScroll, { passive: true });
    alScroll();
    window.__prueba = {
      listo: true, m, datos,
      irA(p) {
        const r = seccion.getBoundingClientRect(), y0 = scrollY + r.top;
        scrollTo(0, y0 + p * (r.height - innerHeight)); alScroll(); m.pintarYa();
      },
      fotogramaPNG: (p, w, h) => m.fotograma(p, w, h).toDataURL('image/png'),
    };
  </script>
</body>
</html>
