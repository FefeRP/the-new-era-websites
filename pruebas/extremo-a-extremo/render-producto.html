<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Foto de producto sobre fondo liso (para recortar con alfa.mjs)</title>
<link rel="icon" href="data:,">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../../demos/reloj/node_modules/three/build/three.module.js","three/addons/":"../../demos/reloj/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Hace de "foto de estudio pedida a la IA sobre fondo liso": el reloj de frente a 3/4, sin suelo ni sombra (el recorte se
// la llevaría igual), sobre un color plano que NO está en el reloj. El reloj tiene un logotipo verde en la esfera, así que
// el fondo es magenta y no verde (regla de capas-alfa: el color del croma según el sujeto).
// ?w=1600&h=1600&fondo=ff00ff
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const W = Number(q.get('w') || 1600), H = Number(q.get('h') || 1600);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#' + (q.get('fondo') || 'ff00ff'));
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;
const key = new THREE.DirectionalLight('#ffe2c4', 2.2); key.position.set(-3, 4, 3); scene.add(key);
const rim = new THREE.DirectionalLight('#c9d6ff', 1.4); rim.position.set(3, 2, -4); scene.add(rim);

const gltf = await new GLTFLoader().loadAsync('../../demos/reloj/public/activos/ChronographWatch.glb');
const modelo = gltf.scene;
modelo.traverse((o) => { if (o.isMesh && /backplate|plane|fondo/i.test(o.name)) o.visible = false; });
const caja = new THREE.Box3().setFromObject(modelo);
const tam = caja.getSize(new THREE.Vector3()), centro = caja.getCenter(new THREE.Vector3());
const s = 1 / Math.max(tam.x, tam.y, tam.z);
modelo.scale.setScalar(s);
modelo.position.sub(centro.multiplyScalar(s));
scene.add(modelo);

// de frente con un giro leve (la esfera se lee) y algo desde arriba: la pose de una foto de catálogo
const camara = new THREE.PerspectiveCamera(26, W / H, 0.01, 100);
const ang = THREE.MathUtils.degToRad(-22);
camara.position.set(Math.sin(ang) * 3.2, 0.5, Math.cos(ang) * 3.2);
camara.lookAt(0.06, 0, 0); // la correa sobresale por detrás: se centra la caja, no la del conjunto
renderer.render(scene, camara);
window.foto = () => { renderer.render(scene, camara); return renderer.domElement.toDataURL('image/png'); };
window.listo = true;
</script>
</body>
</html>
