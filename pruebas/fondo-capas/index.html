<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba · fondo por capas</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: #fff; background: #000; }
  .hero { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .fondo, .capa { position: absolute; inset: 0; }
  .capa { overflow: hidden; }
  .capa[data-profundidad] { inset: -8%; }  /* margen sobrante: el parallax no deja ver el borde */
  /* El "shader": una capa fija por código que no cambia con la escena (aquí un canvas 2D). */
  canvas.capa { width: 100%; height: 100%; mix-blend-mode: screen; opacity: .35; }
  .hero h1 { position: absolute; left: 6vw; top: 12vh; margin: 0; font-size: 9vw; line-height: .9; z-index: 5; }
  .botones { position: absolute; right: 4vw; top: 4vh; z-index: 6; display: flex; gap: 8px; }
  .botones button { font: inherit; padding: 8px 14px; border-radius: 999px; border: 1px solid #fff8; background: #0006; color: #fff; }
  .pasos { position: relative; z-index: 2; }
  .paso { height: 100vh; display: grid; place-items: center; font-size: 2rem; }
</style>
</head>
<body>
<section class="hero">
  <div class="fondo" data-fondo-capas>
    <div class="capa" data-capa="cielo" data-profundidad="-0.8">
      <img data-escena="dia" src="capas/cielo-dia.svg" alt="">
      <img data-escena="atardecer" src="capas/cielo-atardecer.svg" alt="">
      <img data-escena="noche" src="capas/cielo-noche.svg" alt="">
    </div>
    <canvas class="capa" data-capa="shader" id="shader"></canvas>
    <div class="capa" data-capa="montes" data-profundidad="-0.3">
      <img data-escena="dia" src="capas/montes-dia.svg" alt="">
      <img data-escena="atardecer" src="capas/montes-atardecer.svg" alt="">
      <img data-escena="noche" src="capas/montes-noche.svg" alt="">
    </div>
    <div class="capa" data-capa="suelo" data-profundidad="0.4">
      <img data-escena="dia" src="capas/nubes-dia.svg" alt="">
      <img data-escena="atardecer" src="capas/nubes-atardecer.svg" alt="">
      <img data-escena="noche" src="capas/nubes-noche.svg" alt="">
    </div>
  </div>
  <h1>Modelo<br>Alba</h1>
  <div class="botones">
    <button data-ir="dia">Día</button><button data-ir="atardecer">Atardecer</button><button data-ir="noche">Noche</button>
  </div>
</section>
<div class="pasos">
  <div class="paso" data-paso-escena="dia">Paso 1</div>
  <div class="paso" data-paso-escena="atardecer">Paso 2</div>
  <div class="paso" data-paso-escena="noche">Paso 3</div>
</div>
<script type="module">
  import { crearFondoCapas } from '../../plugins/the-new-era-websites/skills/parallax-capas/scripts/fondo-capas.js';
  import { crearParallax } from '../../plugins/the-new-era-websites/skills/parallax-capas/scripts/capas-parallax.js';
  const raiz = document.querySelector('[data-fondo-capas]');
  const porScroll = new URLSearchParams(location.search).has('scroll');
  const fondo = crearFondoCapas(raiz, {
    inicial: 'dia', sentidoPorCapa: { suelo: -1 },
    pasos: porScroll ? document.querySelectorAll('[data-paso-escena]') : null,
  });
  const parallax = crearParallax(raiz);
  document.querySelectorAll('[data-ir]').forEach((b) => b.addEventListener('click', () => fondo.irA(b.dataset.ir)));
  // shader de mentira: un degradado que se mueve, para comprobar que la capa fija sigue ahí al cambiar de escena
  const cv = document.getElementById('shader'), cx = cv.getContext('2d');
  let t = 0, vivo = true;
  (function pintar() {
    if (!vivo) return;
    cv.width = innerWidth; cv.height = innerHeight; t += 0.01;
    const g = cx.createRadialGradient(cv.width * (0.5 + 0.3 * Math.sin(t)), cv.height * 0.3, 10, cv.width / 2, cv.height / 2, cv.width * 0.7);
    g.addColorStop(0, '#ff00aa'); g.addColorStop(1, '#0000');
    cx.fillStyle = g; cx.fillRect(0, 0, cv.width, cv.height);
    requestAnimationFrame(pintar);
  })();
  window.__prueba = { listo: true, fondo, parallax, parar() { vivo = false; } };
</script>
</body>
</html>
